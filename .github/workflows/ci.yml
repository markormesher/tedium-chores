# This file is maintained by Tedium - manual edits will be overwritten!
name: CI
"on":
  - push
jobs:
  check-automergeprs-go:
    runs-on: ubuntu-latest
    container:
      image: docker.io/golang:1.26.6@sha256:0d1d3a794be25f809dd2cb3160d8c73276c4056a9f8242a138e908ddeee7b6b6
    steps:
      - uses: markormesher/ci-resources/setup@c733feb84c0204cdc0bd46f6f8ca557209bb5c33 # v0.8.0
      - env:
          CI_CACHE_TOKEN: ${{ secrets.CI_CACHE_TOKEN }}
        run: ./task -s cacheload-automergeprs-go
      - run: ./task -s deps-automergeprs-go
      - run: ./task -s lint-automergeprs-go
      - env:
          CI_CACHE_TOKEN: ${{ secrets.CI_CACHE_TOKEN }}
        run: ./task -s cachesave-automergeprs-go
  check-generatetasksandci-go:
    runs-on: ubuntu-latest
    container:
      image: docker.io/golang:1.26.6@sha256:0d1d3a794be25f809dd2cb3160d8c73276c4056a9f8242a138e908ddeee7b6b6
    steps:
      - uses: markormesher/ci-resources/setup@c733feb84c0204cdc0bd46f6f8ca557209bb5c33 # v0.8.0
      - env:
          CI_CACHE_TOKEN: ${{ secrets.CI_CACHE_TOKEN }}
        run: ./task -s cacheload-generatetasksandci-go
      - run: ./task -s deps-generatetasksandci-go
      - run: ./task -s lint-generatetasksandci-go
      - env:
          CI_CACHE_TOKEN: ${{ secrets.CI_CACHE_TOKEN }}
        run: ./task -s cachesave-generatetasksandci-go
  check-updateimagelabels-go:
    runs-on: ubuntu-latest
    container:
      image: docker.io/golang:1.26.6@sha256:0d1d3a794be25f809dd2cb3160d8c73276c4056a9f8242a138e908ddeee7b6b6
    steps:
      - uses: markormesher/ci-resources/setup@c733feb84c0204cdc0bd46f6f8ca557209bb5c33 # v0.8.0
      - env:
          CI_CACHE_TOKEN: ${{ secrets.CI_CACHE_TOKEN }}
        run: ./task -s cacheload-updateimagelabels-go
      - run: ./task -s deps-updateimagelabels-go
      - run: ./task -s lint-updateimagelabels-go
      - run: ./task -s test-updateimagelabels-go
      - env:
          CI_CACHE_TOKEN: ${{ secrets.CI_CACHE_TOKEN }}
        run: ./task -s cachesave-updateimagelabels-go
  ci-all:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - check-automergeprs-go
      - check-generatetasksandci-go
      - check-updateimagelabels-go
      - img-applybranchprotection
      - img-automergeprs
      - img-generatetasksandci
      - img-managegotools
      - img-rewritedebianversions
      - img-updateimagelabels
    container:
      image: docker.io/busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
    steps:
      - run: |2
          results=$(echo '${{ toJson(needs) }}' | (grep '"result"' || echo))
          if echo "$results" | grep -q "failure\|cancelled\|skipped"; then
            echo "One or more jobs failed, were cancelled, or were skipped" >&2
            exit 1
          fi
          echo "All jobs passed"
  img-applybranchprotection:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: markormesher/ci-resources/setup@c733feb84c0204cdc0bd46f6f8ca557209bb5c33 # v0.8.0
      - run: buildah login ghcr.io -u "${{ github.actor }}" -p "${{ github.token }}"
      - run: ./task -s imgrefs-applybranchprotection
      - run: ./task -s imgbuild-applybranchprotection
      - run: ./task -s imgpush-applybranchprotection
  img-automergeprs:
    runs-on: ubuntu-latest
    needs:
      - check-automergeprs-go
    permissions:
      packages: write
    steps:
      - uses: markormesher/ci-resources/setup@c733feb84c0204cdc0bd46f6f8ca557209bb5c33 # v0.8.0
      - run: buildah login ghcr.io -u "${{ github.actor }}" -p "${{ github.token }}"
      - run: ./task -s imgrefs-automergeprs
      - run: ./task -s imgbuild-automergeprs
      - run: ./task -s imgpush-automergeprs
  img-generatetasksandci:
    runs-on: ubuntu-latest
    needs:
      - check-generatetasksandci-go
    permissions:
      packages: write
    steps:
      - uses: markormesher/ci-resources/setup@c733feb84c0204cdc0bd46f6f8ca557209bb5c33 # v0.8.0
      - run: buildah login ghcr.io -u "${{ github.actor }}" -p "${{ github.token }}"
      - run: ./task -s imgrefs-generatetasksandci
      - run: ./task -s imgbuild-generatetasksandci
      - run: ./task -s imgpush-generatetasksandci
  img-managegotools:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: markormesher/ci-resources/setup@c733feb84c0204cdc0bd46f6f8ca557209bb5c33 # v0.8.0
      - run: buildah login ghcr.io -u "${{ github.actor }}" -p "${{ github.token }}"
      - run: ./task -s imgrefs-managegotools
      - run: ./task -s imgbuild-managegotools
      - run: ./task -s imgpush-managegotools
  img-rewritedebianversions:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: markormesher/ci-resources/setup@c733feb84c0204cdc0bd46f6f8ca557209bb5c33 # v0.8.0
      - run: buildah login ghcr.io -u "${{ github.actor }}" -p "${{ github.token }}"
      - run: ./task -s imgrefs-rewritedebianversions
      - run: ./task -s imgbuild-rewritedebianversions
      - run: ./task -s imgpush-rewritedebianversions
  img-updateimagelabels:
    runs-on: ubuntu-latest
    needs:
      - check-updateimagelabels-go
    permissions:
      packages: write
    steps:
      - uses: markormesher/ci-resources/setup@c733feb84c0204cdc0bd46f6f8ca557209bb5c33 # v0.8.0
      - run: buildah login ghcr.io -u "${{ github.actor }}" -p "${{ github.token }}"
      - run: ./task -s imgrefs-updateimagelabels
      - run: ./task -s imgbuild-updateimagelabels
      - run: ./task -s imgpush-updateimagelabels
